# Default vhost so unknown Host headers (other domains pointing at this IP)
# do not fall through to the first site in sites-enabled (often admin).
#
# Install:
#   openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -keyout /etc/nginx/catch-all.key -out /etc/nginx/catch-all.crt \
#     -subj "/CN=invalid"
#   sudo cp deploy/nginx/000-catch-all.example.conf /etc/nginx/sites-available/000-catch-all.conf
#   sudo ln -sf /etc/nginx/sites-available/000-catch-all.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/catch-all.crt;
    ssl_certificate_key /etc/nginx/catch-all.key;
    return 404;
}
